<!DOCTYPE html>
<html lang="zh-Hant" data-theme="mint">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>九龍迷圖｜3D 立體浮島冒險</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!-- Three.js & Modules via CDN -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- 載入動畫遮罩 -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div style="font-weight:700; font-size:1.1rem; color:var(--primary);">正在載入九龍迷圖 3D 群島...</div>
    <div style="font-size:0.85rem; color:var(--muted); margin-top:6px;">準備探索各站地標與在地故事</div>
  </div>

  <!-- 頂部工具列 -->
  <header class="top-toolbar">
    <div class="toolbar-left">
      <div class="brand-card">
        <div class="brand-title">🗺️ 九龍迷圖</div>
        <div class="brand-subtitle">一站一浮島・立體穿梭九龍</div>
      </div>
      <button class="btn" id="btn-list" title="地點清單">📋 地點清單</button>
      <button class="btn" id="btn-passport" title="探索護照與背包">🎒 護照與背包 <span id="passport-badge" style="background:var(--accent);color:#fff;padding:2px 6px;border-radius:10px;font-size:0.75rem;">0/7</span></button>
      <button class="btn" id="btn-guide" title="小嚮導問答">🤖 波仔嚮導</button>
    </div>
    <div class="toolbar-right">
      <button class="btn" id="btn-audio" title="背景音樂">🎵 BGM: 關閉</button>
      <button class="btn" id="btn-daynight" title="晝夜切換">☀️ 白天</button>
      <button class="btn" id="btn-reset-cam" title="回到全景">🏠 回到全景</button>
      <div class="theme-switchers">
        <button class="theme-btn active" data-theme-val="mint">薄荷</button>
        <button class="theme-btn" data-theme-val="rice">米紙</button>
        <button class="theme-btn" data-theme-val="ink">墨色</button>
      </div>
    </div>
  </header>

  <!-- 3D 畫布容器 -->
  <div id="canvas-container"></div>

  <!-- 底部 HUD 狀態列 -->
  <div class="bottom-hud">
    <div class="hud-item" id="hud-time">⏱️ 12:00 (白天)</div>
    <div class="hud-item" id="hud-level">⭐ 冒險者: Lv.1 初級探索者</div>
    <div class="hud-item" id="hud-shells">🐚 貝殼: 3</div>
    <div class="hud-item"><button class="btn" id="btn-savecode" style="padding:4px 10px; font-size:0.8rem; min-height:32px;">🔑 接關碼</button></div>
  </div>

  <!-- 側邊面板 (島嶼詳細內容 / 列表 / 嚮導) -->
  <div class="modal-overlay" id="side-modal">
    <div class="side-panel">
      <div class="panel-header">
        <h2 class="panel-title" id="panel-main-title">九龍站點</h2>
        <button class="close-btn" id="panel-close">&times;</button>
      </div>
      <div class="panel-body" id="panel-main-content">
        <!-- 動態填入內容 -->
      </div>
    </div>
  </div>

  <!-- NPC 對話與交易彈窗 -->
  <div class="dialog-modal" id="npc-modal">
    <div class="dialog-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 id="npc-title" style="color:var(--primary); font-size:1.2rem;">NPC 居民</h3>
        <button class="close-btn" id="npc-close" style="width:36px; height:36px;">&times;</button>
      </div>
      <p id="npc-text" style="line-height:1.6; margin-bottom:16px; font-size:1rem; background:var(--bg); padding:12px; border-radius:10px;">對話內容...</p>
      <div style="display:flex; flex-direction:column; gap:8px;" id="npc-actions">
        <!-- 動態對話選項 -->
      </div>
    </div>
  </div>

  <!-- 挑戰測驗彈窗 -->
  <div class="quiz-modal" id="quiz-modal">
    <div class="quiz-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 style="color:var(--primary); font-size:1.2rem;">🧠 在地知識挑戰</h3>
        <button class="close-btn" id="quiz-close" style="width:36px; height:36px;">&times;</button>
      </div>
      <div id="quiz-progress" style="font-size:0.85rem; color:var(--muted); margin-bottom:8px;">第 1 題 / 共 3 題</div>
      <p id="quiz-question" style="font-weight:700; margin-bottom:16px; font-size:1.05rem;">題目載入中...</p>
      <div id="quiz-options" style="display:flex; flex-direction:column; gap:10px; margin-bottom:16px;">
        <!-- 選項按鈕 -->
      </div>
      <div id="quiz-feedback" style="display:none; padding:10px; border-radius:8px; margin-bottom:12px; font-size:0.9rem;"></div>
      <button class="btn btn-primary" id="quiz-next" style="width:100%; display:none;">下一題</button>
    </div>
  </div>

  <!-- 證書彈窗 -->
  <div class="cert-modal" id="cert-modal">
    <div class="cert-box" style="text-align:center;">
      <h2 style="color:var(--primary); margin-bottom:8px;">🏆 九龍迷圖・冒險結業證書</h2>
      <p style="font-size:0.85rem; color:var(--muted); margin-bottom:16px;">恭喜您成功通關所有九龍站點與中央島最終挑戰！</p>
      <div style="border:4px double var(--primary); padding:20px; border-radius:12px; background:var(--bg); margin-bottom:16px;">
        <h3 id="cert-name" style="font-size:1.4rem; margin-bottom:8px; color:var(--ink);">冒險者</h3>
        <p style="font-size:0.95rem; line-height:1.6;">已完成九龍 7 座浮島探索與全島知識挑戰，榮獲<span id="cert-level-title" style="font-weight:700; color:var(--primary);">九龍傳奇導覽大師</span>頭銜！</p>
        <p style="font-size:0.75rem; color:var(--muted); margin-top:12px;">本證書為學習紀錄，非官方認證・發行日期: <span id="cert-date">2026-10-29</span></p>
      </div>
      <div style="display:flex; gap:10px; justify-content:center;">
        <button class="btn btn-primary" id="cert-download">📥 下載證書圖片</button>
        <button class="btn" id="cert-print">🖨️ 列印證書</button>
        <button class="btn" id="cert-close">關閉</button>
      </div>
    </div>
  </div>

  <!-- 主程式邏輯 -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
